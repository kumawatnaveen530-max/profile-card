 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>UI-Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .con{
            height: 750px;
            /* border: 1px solid black; */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 70%;
            width: 70%;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
            /* border: 1px solid black; */
            display: flex;
        }
        .left, .right, .center{
            /* border: 1px solid black; */
            height: 100%;
        }
        .left{
            width: 2%;
            background-color: rgb(10, 10, 79);
            border-radius: 30px;
        }
        .center{
            width: 62%;
            font-weight: bolder;
            font-size: 117px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: rgb(1, 1, 132);
            background-color: rgb(244,244, 244);
            border-radius: 20px;
        }
        p{
            margin-left: 5px;
        }
        .right{
            width: 36%;
            border-radius: 10px;
        }
        .top{
            /* border: 1px solid black; */
            height: 30%;
            width: 100%;
        }
        .top-in{
            height: 90%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;

            /* border: 1px solid black; */
            background-color: navy;
        }
        .bottom{
            height: 70%;
            /* border: 1px solid black; */
        }
        .circle{
            position: absolute;
            height: 125px;
            width: 125px;
            border: 5px solid navy;
            border-radius: 50%;
            top: 125px;
            right: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 3px solid white;
        }
        .bottom>h1{
            text-align: center;
            font-size: 25px;
            margin-top: 3%;
        }
        .icon{
            margin: 7%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;

            /* font-size: 30px; */
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            background: linear-gradient(purple, red, yellow, orange);
            background-clip: text;
            color: transparent;
        }
        .fa-linkedin{
            color: rgb(70, 70, 208);
        }   
        .fa-facebook{
            color: blue;
        }
        .fa-github{
            color: rgb(0, 0, 0);
        }
        .fa-behance{
            color: rgb(0, 139, 90);
        }
        .fa-heart{
            color: red;
        }
        .fa-comment{
            color: rgb(213, 213, 213);
        }
        .fa-share{
            color: rgb(5, 95, 5);
        }
        .button{
            height: 20%;
            /* border: 1px solid black; */
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            
        }
        .b1{
            border-radius: 50px;
            height: 40%;
            width: 40%;
            background-color: navy; 
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <p>Profile Card UI UX Design</p>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="Annotation 2026-09-29 145746.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Website Developer</h1>
                    <h1>Dezyne École College</h1>
                    <h1>BCA 1st Year</h1>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-linkedin fa-2x"></i>
                        <i class="fa fa-brands fa-behance fa-2x"></i>
                        <i class="fa fa-brands fa-github fa-2x"></i>
                    </div>
                    <div class="button">
                        <div class="b1">Subscribe</div>
                        <div class="b1">Message</div>
                    </div>
                    <div class="icon">
                        <i class="fa fa-solid fa-heart fa-2x"></i>60.4K
                        <i class="fa fa-solid fa-comment fa-2x"></i>20K
                        <i class="fa fa-solid fa-share fa-2x"></i>12.6K
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
